name: Daily update and publish

on:
  schedule:
    - cron: "0 23 * * 1-5"   # 23:00 UTC Mon-Fri, after the US close
  workflow_dispatch:          # "Run workflow" button for a manual update
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices and compute scores
        continue-on-error: true   # if the source is down, keep yesterday's data
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python scripts/update.py

      - name: Save new data to the repo
        run: |
          git config user.name "sector-compass-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data.json history.csv last_run.txt; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || (git commit -m "Data update $(date -u +%F)" && git push)

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html data.json _site/
          [ -f history.csv ] && cp history.csv _site/ || true
          [ -f CNAME ] && cp CNAME _site/ || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
